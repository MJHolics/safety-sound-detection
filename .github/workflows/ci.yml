name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 순수 단위테스트만(데이터셋·GPU 불필요). torch 테스트는 미설치 시 skip. 버전 고정.
      - run: pip install "numpy==2.2.6" "pytest==8.4.2"
      - run: pytest -q
